name: Release simple-edit

on:
  push:
    tags:
      - 'simple-edit-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: examples/simple-edit/go.mod

      - name: Build the archives
        working-directory: examples/simple-edit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            bin=simple-edit
            if [ "$os" = windows ]; then
              bin=simple-edit.exe
            fi
            rm -rf pkg
            mkdir -p pkg/simple-edit
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags '-s -w' -o "pkg/simple-edit/$bin" .
            cp plugin.toml README.md pkg/simple-edit/
            if [ "$os" = windows ]; then
              (cd pkg && zip -qr "../dist/${TAG}_${os}_${arch}.zip" simple-edit)
            else
              tar -czf "dist/${TAG}_${os}_${arch}.tar.gz" -C pkg simple-edit
            fi
          done
          ls -l dist

      - name: Attach them to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Unpack the archive for your machine and drop the `simple-edit`
            folder in `<configdir>/plugins/`, next to `monbooru.toml`. Start it
            from its row under Settings > Plugins and approve the pairing card.
          files: examples/simple-edit/dist/*
