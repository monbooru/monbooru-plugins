name: Release simple-edit

on:
  push:
    branches:
      - main
    paths:
      - 'examples/simple-edit/**'
      - '.github/workflows/release-simple-edit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-simple-edit
  cancel-in-progress: true

env:
  TAG: simple-edit

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/simple-edit/go.mod

      - name: Build the archives
        working-directory: examples/simple-edit
        run: |
          mkdir -p dist
          # linux and windows, on amd64 and arm64.
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            bin=simple-edit
            if [ "$os" = windows ]; then
              bin=simple-edit.exe
            fi
            rm -rf pkg
            mkdir -p pkg/simple-edit
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags '-s -w' -o "pkg/simple-edit/$bin" .
            cp plugin.toml README.md pkg/simple-edit/
            if [ "$os" = windows ]; then
              (cd pkg && zip -qr "../dist/simple-edit_${os}_${arch}.zip" simple-edit)
            else
              tar -czf "dist/simple-edit_${os}_${arch}.tar.gz" -C pkg simple-edit
            fi
          done
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"

          notes="$(cat <<'EOF'
          Latest build of the simple-edit example, rebuilt from `main` whenever it
          changes.

          Unpack the archive for your machine and drop the `simple-edit` folder in
          `<configdir>/plugins/`, next to `monbooru.toml`. Start it from its row
          under Settings > Plugins and approve the pairing card.
          EOF
          )"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title simple-edit --notes "$notes"
          else
            gh release create "$TAG" --title simple-edit --notes "$notes"
          fi

          gh release upload "$TAG" examples/simple-edit/dist/* --clobber
